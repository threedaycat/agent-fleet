# 定时与常驻任务 · 模板
#
# 复制成 _local-services.yaml 再改（_local-* 被 .gitignore 挡掉）：
#     cp services.example.yaml _local-services.yaml
#     ./fleet_up.py services status
#     ./fleet_up.py services install
#
# 解决的问题：在此之前，机器上跑着的定时任务是**一条条手工 launchctl 装进去的**，
# 仓库里没有任何记录。换台机器不会自动有，改了也没人知道改过什么，出问题只能
# 一个个 plist 翻。现在它们是声明，`services status` 能一眼看出「装了没 / 跟声明
# 对不对得上」。
#
# ── 字段 ──
#   name          你自己叫它什么（命令行点名用）
#   label         launchd label，必须全局唯一
#   cmd           [程序, 参数...]；~ 会展开
#   cwd           工作目录
#   log           stdout 落到哪（不单独给 log_err 就 stderr 也走这里）
#   keepalive     true = 常驻，挂了自动拉回
#   run_at_load   开机/登录就跑（不写时跟 keepalive 一致）
#   interval      每 N 秒跑一次
#   calendar      日历触发，可以是一条也可以是一组
#                 weekday 支持 1-5 / [1,3,5] / 5；1=周一，0 和 7 都是周日
#   env           额外环境变量。PATH 和 HOME 不写会自动补——
#                 launchd 给的 PATH 是最小集，homebrew 装的东西一律找不到
#   owner         **这条由别的东西安装，本层只声明、不接管**
#                 用来避免重复安装：同一个采集进程被装两遍，会有两份进程轮同一份
#                 token、写同一份 state.json，表现出来是「采集变慢、疑似停了」

version: 1

services:
  # ── 采集器三件套：run.sh install 装的，这里只登记，不接管 ──
  - name: dtwatch-at
    label: com.workos.dtwatch.at
    owner: ./run.sh install
    cmd: ["./run.sh", "at-stream"]
    keepalive: true

  - name: dtwatch-poll
    label: com.workos.dtwatch.poll
    owner: ./run.sh install
    cmd: ["./run.sh", "poll-loop", "300"]
    keepalive: true

  - name: dtwatch-push
    label: com.workos.dtwatch.push
    owner: ./run.sh install
    cmd: ["./run.sh", "push-loop", "8"]
    keepalive: true

  # ── 以下由本层安装 ──

  # 日报：工作日傍晚生成草稿。生成而已，发不发是人的事。
  - name: report-daily
    label: com.workos.report.daily
    cmd: ["/bin/bash", "~/.claude/skills/handoff/scripts/report_flow.sh", "daily"]
    cwd: ~/.claude/journal/.drafts
    log: ~/.claude/journal/.drafts/launchd.daily.out
    run_at_load: false
    calendar:
      - {weekday: 1-5, hour: 18, minute: 30}

  # 周报：周五下班前。比日报早一小时，好让周报能引用当天日报之前的内容。
  - name: report-weekly
    label: com.workos.report.weekly
    cmd: ["/bin/bash", "~/.claude/skills/handoff/scripts/report_flow.sh", "weekly"]
    cwd: ~/.claude/journal/.drafts
    log: ~/.claude/journal/.drafts/launchd.weekly.out
    run_at_load: false
    calendar:
      - {weekday: 5, hour: 17, minute: 30}

  # 控制台页面。浏览器开一个标签页常驻，页面自己会重载。
  # 它本身也归这一层管——不然又变成一个「机器上跑着但没人知道谁装的」的东西。
  - name: console
    label: com.workos.console
    cmd: ["/usr/bin/python3", "./console.py", "--loop", "10", "--fast"]
    cwd: .
    log: ./data/console.out
    keepalive: true
    run_at_load: true

  # 别让机器睡着，否则夜里的定时任务全部顺延到你早上开盖那一刻。
  # -s 只在插电时生效；合盖仍然会睡，这个 caffeinate 拦不住。
  - name: caffeinate
    label: com.workos.caffeinate
    cmd: ["/usr/bin/caffeinate", "-s"]
    keepalive: true
    run_at_load: true
    log: ./data/caffeinate.out
